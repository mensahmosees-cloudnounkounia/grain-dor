:root{
  --sand:#F2E9D8;
  --sand-deep:#E7D9BC;
  --card:#FBF6EC;
  --soil:#6B4226;
  --clay:#B5502C;
  --clay-dark:#8F3D20;
  --leaf:#4E7C4F;
  --leaf-dark:#365C39;
  --gold:#E3A93C;
  --ink:#221A10;
  --ink-soft:#5B4C39;
  --root-bg1:#3A2A17;
  --root-bg2:#1F1710;
  --danger:#A6402D;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  background: radial-gradient(circle at 15% 10%, #ffffff30, transparent 40%), var(--sand);
  background-image: linear-gradient(var(--sand) 0%, var(--sand) 100%);
  font-family:'Space Grotesk', sans-serif;
  color:var(--ink);
  min-height:100vh;
}

.app-shell{
  box-sizing:border-box;
  height:auto;
  min-height:100dvh;
  overflow:visible;
  width:100%;
  padding-top:var(--safe-area-inset-top);
  background: radial-gradient(circle at 15% 10%, #ffffff30, transparent 40%), var(--sand);
  background-image: linear-gradient(var(--sand) 0%, var(--sand) 100%);
  display:flex;
  justify-content:center;
  padding-left:16px;
  padding-right:16px;
  padding-bottom:32px;
  overflow-x:clip;
}

.app-shell-inner{
  width:100%;
  max-width:1100px;
  padding-top:32px;
  flex:none;
  height:auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.app-shell-inner > :not(.frame-wrap){
  flex:none;
}

.frame-wrap{
  flex:none;
  min-height:0;
  align-items:center;
}

@media (prefers-reduced-motion: reduce){
  *{
    animation-duration:0.001ms !important;
    transition-duration:0.001ms !important;
  }
}

.page{
  width:100%;
  max-width:1100px;
}

.top-label{
  text-align:center;
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:6px;
}

h1.brand{
  text-align:center;
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:clamp(30px,5.4vw,48px);
  margin:0 0 6px;
  color:var(--ink);
  letter-spacing:0.01em;
  white-space:nowrap;
}

h1.brand span{
  color:var(--clay);
}

@media (max-width:380px){
  h1.brand{
    white-space:normal;
  }
}

.tagline{
  text-align:center;
  color:var(--ink-soft);
  font-size:15px;
  max-width:520px;
  margin:0 auto 36px;
  line-height:1.5;
}

.frame-wrap{
  display:flex;
  justify-content:center;
}

.phone{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:34px;
  border:1px solid #00000012;
  box-shadow:0 30px 60px -20px rgba(34,26,16,0.35), 0 2px 0 #fff8 inset;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  height:auto;
  max-height:none;
  min-height:0;
}

.phone-notch{
  display:none;
}

.phone-notch::after{
  content:"";
  width:70px;
  height:8px;
  background:#0003;
  border-radius:10px;
}

.status-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 18px 6px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  flex:none;
}

.offline-pill{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--leaf);
  color:#fff;
  padding:3px 10px 3px 8px;
  border-radius:20px;
  font-size:10.5px;
  letter-spacing:0.04em;
}

.offline-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 0 3px #ffffff33;
}

.screen{
  padding:6px 20px 24px;
  flex:none;
  min-height:0;
  overflow-y:visible;
  overscroll-behavior:auto;
}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:8px 0 18px;
}

.app-header h2{
  font-family:'Fraunces', serif;
  font-size:22px;
  margin:0;
  font-weight:600;
}

.lang-toggle{
  display:flex;
  background:var(--sand-deep);
  border-radius:20px;
  padding:3px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
}

.lang-toggle button{
  border:none;
  background:transparent;
  padding:6px 10px;
  border-radius:16px;
  cursor:pointer;
  color:var(--ink-soft);
  font-family:inherit;
  font-size:11px;
}

.lang-toggle button.active{
  background:var(--ink);
  color:#fff;
}

.mic-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:linear-gradient(135deg, var(--clay), var(--clay-dark));
  color:#fff;
  padding:14px 16px;
  border-radius:18px;
  margin-bottom:20px;
  cursor:pointer;
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none;
  box-shadow:0 10px 24px -10px rgba(181,80,44,0.6);
}

.mic-icon{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#ffffff26;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex:none;
  position:relative;
}

.mic-icon.listening::before{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:2px solid #fff9;
  animation:pulse 1.4s ease-out infinite;
}

@keyframes pulse{
  0%{
    transform:scale(0.8);
    opacity:0.8;
  }

  100%{
    transform:scale(1.6);
    opacity:0;
  }
}

.mic-text{
  flex:1;
  min-width:0;
}

.mic-text .t1{
  font-weight:600;
  font-size:14.5px;
  overflow-wrap:anywhere;
}

.mic-text .t2{
  font-size:11.5px;
  opacity:0.85;
  margin-top:2px;
  overflow-wrap:anywhere;
}

.section-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:22px 0 10px;
}

.crop-grid-wrap{
  position:relative;
}

.crop-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:8px;
  max-height:272px;
  overflow-y:auto;
  padding:2px 2px 4px;
  scrollbar-width:thin;
}

.crop-grid::-webkit-scrollbar{

@keyframes fadeIn{
  from{

  to{

  }

,conseil:"Sol profond sans cailloux, éclaircissage."},patate:{sols:"Sableux, Sablo-argileux, Terre de barre",avoid:"Bas-fond",saison:"Mars–oct.",eau:"Faible–Moyen",cycle:"90–120 jours",rendement:"8–18 t/ha",conseil:"Boutures saines, buttes, bon drainage."},banane:{sols:"Limoneux, Bas-fond, Sablo-argileux",avoid:"Terre à grain",saison:"Toute l’année",eau:"Élevé",cycle:"9–12 mois premier régime",rendement:"20–40 t/ha",conseil:"Beaucoup d’eau + matière organique, protection contre vent."},papaye:{sols:"Limoneux, Sablo-argileux, Terre de barre",avoid:"Bas-fond",saison:"Toute l’année",eau:"Moyen",cycle:"8–10 mois premiers fruits",rendement:"30–60 t/ha",conseil:"Sol drainé, éviter eau stagnante au pied."},palme:{sols:"Terre de barre, Limoneux, Sablo-argileux",avoid:"Sableux",saison:"Plantation juin–août, production toute l’année",eau:"Élevé",cycle:"Pérenne, 3–4 ans première récolte",rendement:"10–20 t/ha régimes",conseil:"Plants améliorés, entretien couronne."},anacarde:{sols:"Terre de barre, Sablo-argileux, Terre à grain",avoid:"Bas-fond",saison:"Plantation juin–août",eau:"Faible",cycle:"Pérenne",rendement:"0,5–1,2 t/ha noix",conseil:"Taille, lutte contre anthracnose."},karite:{sols:"Sablo-argileux, Terre à grain, Ferrugineux",avoid:"Bas-fond",saison:"Plantation juin–août, récolte mai–août",eau:"Faible",cycle:"Pérenne",rendement:"0,5–1 t/ha noix (arbre adulte)",conseil:"Protéger les jeunes plants du bétail et du feu."},teck:{sols:"Terre de barre, Ferrugineux, Limoneux",avoid:"Bas-fond",saison:"Plantation juin–août",eau:"Faible–Moyen",cycle:"Pérenne 15–25 ans",rendement:"Bois d’œuvre",conseil:"Élagage, espacement."},moringa:{sols:"Sablo-argileux, Terre de barre, Sableux",avoid:"Bas-fond",saison:"Toute l’année",eau:"Faible",cycle:"6–8 mois première coupe",rendement:"Feuilles 5–10 t/ha/an",conseil:"Taille fréquente pour feuilles tendres."},sesame:{sols:"Sableux, Sablo-argileux, Terre à grain",avoid:"Argileux",saison:"Mai–sept.",eau:"Faible",cycle:"80–100 jours",rendement:"0,4–0,8 t/ha",conseil:"Sol léger, semis peu profond."},voandzou:{sols:"Sableux, Sablo-argileux, Terre à grain",avoid:"Argileux",saison:"Avr.–sept.",eau:"Faible",cycle:"90–120 jours",rendement:"0,5–1,2 t/ha",conseil:"Très rustique, bon pour sols pauvres et secs."},fonio:{sols:"Sableux, Terre à grain, Sablo-argileux",avoid:"Bas-fond",saison:"Mai–sept.",eau:"Faible",cycle:"70–90 jours",rendement:"0,5–1 t/ha",conseil:"Cycle très court, bon pour soudure."},haricot:{sols:"Limoneux, Sablo-argileux",avoid:"Argileux",saison:"Mars–juil. + sept.–nov.",eau:"Moyen",cycle:"60–90 jours",rendement:"0,8–1,5 t/ha sec",conseil:"Tuteurage pour variétés grimpantes."},chou:{sols:"Limoneux, Sablo-argileux",avoid:"Sableux",saison:"Nov.–fév.",eau:"Moyen–Élevé",cycle:"70–100 jours",rendement:"20–35 t/ha",conseil:"Arrosage régulier, paillage, surveillance chenilles."},concombre:{sols:"Limoneux, Sablo-argileux",avoid:"Argileux",saison:"Nov.–mars + pluies avec tuteur",eau:"Élevé",cycle:"50–70 jours",rendement:"15–30 t/ha",conseil:"Tuteurage, arrosage au pied."},aubergine:{sols:"Limoneux, Sablo-argileux, Terre de barre",avoid:"Sableux",saison:"Toute l’année, idéal nov.–mars",eau:"Moyen",cycle:"70–100 jours",rendement:"15–25 t/ha",conseil:"Pépinière, arrosage régulier."},gingembre:{sols:"Limoneux, Sablo-argileux, Terre de barre",avoid:"Argileux",saison:"Mars–juin plantation",eau:"Moyen–Élevé",cycle:"8–10 mois",rendement:"10–20 t/ha frais",conseil:"Ombre partielle, paillage, sol riche."},curcuma:{sols:"Limoneux, Sablo-argileux",avoid:"Sableux",saison:"Mars–juin plantation",eau:"Moyen–Élevé",cycle:"8–10 mois",rendement:"10–20 t/ha frais",conseil:"Comme gingembre, paillage épais."},bissap:{sols:"Sablo-argileux, Terre de barre, Sableux",avoid:"Bas-fond",saison:"Mai–sept.",eau:"Faible–Moyen",cycle:"120–150 jours",rendement:"Calices 0,5–1,5 t/ha sec",conseil:"Récolte calices dès qu’ils sont rouges et fermes."},baobab:{sols:"Sablo-argileux, Terre à grain, Ferrugineux",avoid:"Bas-fond",saison:"Plantation juin–août",eau:"Faible",cycle:"Pérenne",rendement:"Feuilles + fruits après 8–10 ans",conseil:"Protéger jeunes plants du bétail."},citron:{sols:"Limoneux, Sablo-argileux, Terre de barre",avoid:"Bas-fond",saison:"Plantation juin–août",eau:"Moyen",cycle:"Pérenne",rendement:"8–15 t/ha",conseil:"Arrosage jeune plant en saison sèche."}},ky={mais:"Cordons de pierre ou bandes enherbées + compost en poquets sur terre de barre, pour garder l’eau et la terre.",manioc:"Zaï léger + paillage sur sols sableux, pour retenir l’eau ; éviter le bas-fond qui garde l’eau stagnante.",igname:"Buttes + paillage épais, rotation longue pour laisser le sol se reposer.",riz:"Casiers en bas-fond + diguettes, compost pour nourrir le sol et tenir l’eau.",sorgho:"Cordons pierreux ou bandes enherbées + compost en poquets, rotation avec une légumineuse.",mil:"Zaï enrichi au compost + paillage, apport de fumier pour retenir l’eau sur sols sableux et terre à grain.",arachide:"Zaï + compost léger sur sols sableux, pour garder l’humidité sans noyer les graines.",niebe:"Culture de couverture, rotation après maïs : le niébé couvre le sol et enrichit la parcelle suivante.",soja:"Rotation + paillage, avec inoculation quand c’est possible, pour un sol plus vivant.",coton:"Bandes enherbées + rotation avec légumineuses, pour garder la terre et nourrir le sol.",ananas:"Paillage + cordons en pente, drainage soigné pour éviter l’eau stagnante au pied.",mangue:"Demi-lunes autour du jeune arbre + paillage, pour capter l’eau et garder le pied humide.",tomate:"Paillage + compost, billons drainants pour garder l’humidité sans noyer les racines.",piment:"Paillage + compost en poquets. Piment doux : même conduite, sol riche en matière organique.",gombo:"Paillage + compost en poquets, pour garder l’eau et nourrir chaque pied.",oignon:"Billons + paillage léger, compost bien décomposé pour un sol meuble et drainé.",carotte:"Billons meubles + compost fin, pour des racines droites sur sol léger.",patate:"Buttes + paillage, pour garder l’humidité et garder les buttes meubles.",banane:"Demi-lunes + paillage épais + compost, pour garder beaucoup d’eau au pied.",papaye:"Demi-lunes + drainage, paillage pour garder l’humidité sans eau stagnante au pied.",palme:"Demi-lunes + couverture végétale, compost pour garder l’eau et nourrir le sol. Palmier à huile : même conduite.",anacarde:"Demi-lunes + paillage, bordure agroforestière pour protéger le sol. Cajou : même conduite.",karite:"Demi-lunes + paillage autour du jeune plant, bordure agroforestière, protéger du bétail et du feu.",teck:"Cordons pierreux + paillage du jeune plant, pour garder l’eau et la terre en pente.",moringa:"Haie vive + zaï, paillage pour garder l’eau au pied et protéger la parcelle.",sesame:"Zaï + compost léger sur sols sableux, pour retenir l’eau sans noyer les graines.",voandzou:"Zaï + couverture végétale, sols pauvres : le voandzou couvre et enrichit le sol. Bambara : même conduite.",fonio:"Couverture végétale + jachère améliorée, pour reposer et enrichir le sol.",haricot:"Rotation + paillage, tuteurage pour les variétés grimpantes.",chou:"Billons + paillage épais, compost riche pour garder l’eau et nourrir le sol.",concombre:"Paillage + billons, tuteurage pour garder les fruits hors du sol humide.",aubergine:"Paillage + compost en poquets, pour garder l’eau et nourrir chaque pied.",gingembre:"Paillage épais + ombre partielle, billons pour garder l’humidité sans eau stagnante.",curcuma:"Paillage épais + billons, pour garder l’humidité et un sol meuble.",bissap:"Zaï + paillage, rotation avec céréales pour reposer le sol.",baobab:"Demi-lunes + protection du jeune plant, agroforesterie en bordure pour protéger le sol.",citron:"Demi-lunes + paillage, compost pour garder l’eau au pied. Citron vert : même conduite."},yf={mais:"Trier les grains, écarter grains cassés et moisis. Tester la germination sur une poignée avant de semer. Semer 2 à 3 graines par poquet, recouvrir légèrement et garder le sol humide au départ.",manioc:"Choisir des boutures saines, droites, de tiges mûres, sans taches ni pourriture. Couper en morceaux, garder les yeux vers le haut, planter incliné ou vertical dans un sol bien drainé. Ne pas utiliser de boutures d’un pied malade.",igname:"Choisir des semenceaux sains, fermes, sans blessure ni pourriture. Couper les gros tubercules, laisser sécher la coupe à l’ombre avant de planter sur butte. Planter la tête vers le haut, pailler après plantation.",riz:"Choisir des semences propres et pleines, tremper et pré-germer avant le semis ou le repiquage. Semer en pépinière, repiquer des plants jeunes et vigoureux, garder le casier humide sans noyer les plants.",sorgho:"Trier les grains, écarter grains vides et moisis. Tester la germination. Semer peu profond, 3 à 4 graines par poquet, démarrer après les premières bonnes pluies, éclaircir à 2 plants vigoureux.",mil:"Choisir des épis sains et bien secs. Battre, vanner et trier les grains pleins. Semer peu profond sur sol léger, éclaircir après la levée pour garder les plants les plus vigoureux.",arachide:"Choisir des gousses pleines et bien sèches, décortiquer juste avant le semis. Garder les graines entières, sans blessure. Semer 1 à 2 graines par poquet, peu profond, sur sol léger et bien drainé.",niebe:"Choisir des graines pleines, sans trous d’insectes. Trier et écarter les graines attaquées. Semer 2 graines par poquet, peu profond, et surveiller la levée. Conserver les semences au sec, en sac hermétique.",soja:"Choisir des graines pleines, non cassées, bien sèches. Trier avant le semis, semer peu profond sur sol meuble. Si possible, inoculer les graines avant de semer, puis semer sans attendre au soleil.",coton:"Choisir des semences saines et bien sèches. Trier, écarter les graines légères et abîmées. Semer à faible profondeur, démarrer après les premières bonnes pluies, éclaircir après la levée.",ananas:"Choisir des rejets sains, vigoureux, sans pourriture au cœur. Laisser sécher la base à l’ombre avant de planter. Planter droit, bien tasser au pied, pailler et garder le sol drainé.",mangue:"Choisir des noyaux de fruits mûrs et sains, ou mieux des plants greffés vigoureux. Semer le noyau rapidement après la récolte, garder humide sans noyer. Planter le jeune arbre en demi-lune, protéger du bétail.",tomate:"Choisir des semences saines, semer en pépinière ombragée et bien drainée. Semer peu profond, recouvrir finement, arroser au pied. Repiquer des plants vigoureux, avec une bonne motte, quand ils ont plusieurs feuilles.",piment:"Choisir des semences de fruits mûrs et sains, bien sèches. Semer en pépinière fine et ombragée, peu profond. Repiquer des plants vigoureux. Piment doux : même conduite, pépinière soignée et sol riche en matière organique.",gombo:"Tremper les graines une nuit pour aider la levée. Choisir des graines pleines et dures, sans blessure. Semer 2 à 3 graines par poquet, peu profond, éclaircir après la levée.",oignon:"Choisir des semences fines et bien sèches ou des bulbilles fermes et saines. Semer en pépinière fine, peu profond, arroser doucement. Repiquer des plants vigoureux, sans casser les racines, sur billons.",carotte:"Choisir des semences fines et bien sèches. Semer en ligne, très peu profond, sur sol meuble sans cailloux. Recouvrir finement, garder humide jusqu’à la levée, éclaircir pour laisser les racines se développer.",patate:"Choisir des boutures de tiges saines, vigoureuses, sans taches. Couper des morceaux avec plusieurs nœuds, laisser sécher légèrement. Planter incliné sur butte, enfoncer deux nœuds, pailler après plantation.",banane:"Choisir des rejets sains, vigoureux, sans pourriture ni vers. Couper proprement, laisser sécher la coupe à l’ombre. Planter dans une fosse enrichie en compost, bien tasser, pailler et arroser au départ.",papaye:"Choisir des graines de fruits mûrs et sains, laver et sécher à l’ombre. Semer en pépinière ou en poquet, peu profond. Garder les plants vigoureux, repiquer sans casser la racine, sur sol drainé.",palme:"Choisir des plants améliorés, vigoureux, avec un bon cœur. Vérifier les racines, écarter les plants chétifs. Planter dans une fosse enrichie, bien tasser, pailler et arroser en saison sèche.",anacarde:"Choisir des noix pleines, lourdes et bien sèches. Tremper avant le semis pour aider la levée. Semer la noix sur le côté, peu profond, ou planter un jeune plant vigoureux en demi-lune.",karite:"Choisir des noix pleines et bien mûres, semer rapidement sans laisser sécher trop longtemps. Semer peu profond, garder humide. Protéger le jeune plant du bétail, du feu et de la sécheresse.",teck:"Choisir des graines ou des plants vigoureux et sains. Tremper les graines avant le semis pour aider la levée. Repiquer des plants droits et vigoureux, bien tasser, pailler au pied.",moringa:"Choisir des graines pleines et bien sèches, ou des boutures de tiges saines. Tremper les graines avant le semis. Semer 2 graines par poquet ou planter la bouture droite, pailler et arroser au départ.",sesame:"Choisir des graines pleines, propres et bien sèches. Semer très peu profond, en ligne, sur sol léger. Recouvrir à peine, garder humide jusqu’à la levée, éclaircir si les plants sont trop serrés.",voandzou:"Choisir des graines pleines, sans trous d’insectes, bien sèches. Trier avant le semis. Semer 2 graines par poquet, peu profond, sur sol pauvre mais drainé. Conserver les semences au sec.",fonio:"Choisir des graines propres, bien sèches et sans impuretés. Vanner et trier avant le semis. Semer en ligne, très peu profond, recouvrir à peine, garder le sol humide jusqu’à la levée.",haricot:"Choisir des graines pleines, sans trous ni moisissures, bien sèches. Trier avant le semis. Semer 2 graines par poquet, peu profond, tuteurer les variétés grimpantes après la levée.",chou:"Choisir des semences fines et bien sèches. Semer en pépinière ombragée, peu profond, arroser doucement. Repiquer des plants vigoureux, avec une bonne motte, sur billons enrichis en compost.",concombre:"Choisir des graines pleines et bien sèches, de fruits mûrs et sains. Semer en poquet, 2 à 3 graines, peu profond. Éclaircir après la levée, tuteurer et pailler.",aubergine:"Choisir des semences de fruits mûrs et sains, bien sèches. Semer en pépinière ombragée, peu profond. Repiquer des plants vigoureux, avec une bonne motte, sur sol enrichi.",gingembre:"Choisir des rhizomes fermes, sains, avec des yeux bien visibles. Couper en morceaux avec un œil chacun, laisser sécher la coupe à l’ombre. Planter l’œil vers le haut, peu profond, sur billon paillé.",curcuma:"Choisir des rhizomes fermes, sains, avec des yeux bien visibles. Couper en morceaux avec un œil chacun, laisser sécher la coupe à l’ombre. Planter l’œil vers le haut, peu profond, sur billon paillé.",bissap:"Choisir des graines pleines et bien sèches. Trier avant le semis. Semer 2 à 3 graines par poquet, peu profond, éclaircir après la levée. Garder les semences au sec.",baobab:"Choisir des graines pleines et bien mûres. Scarifier légèrement ou tremper pour aider la levée. Semer peu profond, garder humide. Protéger le jeune plant du bétail.",citron:"Choisir des graines de fruits mûrs et sains, ou mieux des plants greffés vigoureux. Laver et sécher les graines à l’ombre, semer rapidement. Repiquer un plant vigoureux en demi-lune, pailler. Citron vert : même conduite."};for(let e in ce){let n=ky[e],t=yf[e];if(n||t)ce[e]={...ce[e],conseil:ce[e].conseil+(n?" — Méthode sous-régionale utile pour ton sol : "+n:"")+(t?" — Technique de semences : "+t:"")}}var mf={mais:{climat:"Pluies tardives ou pause sèche à la floraison = épis mal remplis. Sème dès les premières pluies utiles, garde un peu de semence pour un second semis si la levée rate.",marche:"Vends une partie juste après récolte pour les besoins urgents, stocke le reste bien sec. Ne brade pas tout à la récolte quand tout le monde vend.",solEau:"Risque : engorgement sur sol lourd, racines qui étouffent. Action : billons + rigole pour évacuer l’eau, ne travaille pas un sol détrempé.",decision:"Si tu vois des feuilles qui s’enroulent en pleine journée, arrose peu au pied le soir, puis paille."},manioc:{climat:"Pause sèche longue = tubercules plus petits, mais la plante tient. Plante tôt en saison des pluies pour profiter de toute la saison.",marche:"Ne récolte pas tout d’un coup : laisse en terre et récolte par besoin. Vends frais vite après arrachage, sinon il durcit.",solEau:"Risque : pourriture en eau stagnante. Action : buttes drainantes + paillage, jamais de bas-fond qui stagne.",decision:"Si la tige noircit au pied, arrache le pied malade, ne replante pas sa bouture."},igname:{climat:"Chaleur + manque d’eau au démarrage = levée lente. Plante sur buttes avant les fortes pluies, paille pour garder la fraîcheur.",marche:"Vends une partie à la récolte, garde les beaux tubercules pour semence et pour la soudure. Ne vends pas tes meilleurs semenceaux.",solEau:"Risque : buttes qui s’effondrent et tubercules qui pourrissent si trop d’eau. Action : buttes hautes, drainage, paillage épais.",decision:"Si les tiges jaunissent trop tôt, vérifie l’eau au pied : trop sec, paille et arrose peu ; trop mouillé, ouvre le drainage."},riz:{climat:"Pluies tardives = repiquage tardif et rendement plus faible. Prépare la pépinière dès que les premières pluies s’installent.",marche:"Vends le paddy quand tu as besoin d’argent, mais garde une réserve pour la famille. Ne vends pas tout si le grenier est vide.",solEau:"Risque : casier qui se vide trop vite ou qui déborde. Action : diguettes solides + niveau d’eau bas et régulier, pas de pied noyé en permanence.",decision:"Si les feuilles jaunissent par plaques, vérifie l’eau : trop ou pas assez, ajuste le niveau avant d’ajouter quoi que ce soit."},sorgho:{climat:"Pluies qui s’arrêtent tôt = grains mal remplis. Sème tôt, choisis un cycle adapté, et garde la paille pour couvrir le sol.",marche:"Stocke bien sec après battage. Vends quand les greniers se vident, pas au moment où tout le monde vend.",solEau:"Risque : croûte en surface qui bloque la levée. Action : sarclage léger pour casser la croûte, paillage entre les lignes.",decision:"Si la levée est clairsemée après une croûte, casse la croûte doucement et resème les manques."},mil:{climat:"Sécheresse en début de cycle = levée faible. Sème dès les premières bonnes pluies, ne sème pas sur sol sec en espérant la pluie.",marche:"Garde une réserve pour la soudure. Vends petit à petit, pas tout à la récolte.",solEau:"Risque : eau qui file sur sol sableux. Action : zaï + compost en poquet, paillage pour garder l’humidité.",decision:"Si les jeunes plants jaunissent après une pluie forte, vérifie si l’eau a emporté la terre : refais les poquets et paille."},arachide:{climat:"Pause sèche à la floraison = moins de gousses. Sème tôt, paille léger pour garder l’humidité sans noyer.",marche:"Sèche vite et bien avant de stocker. Vends décortiqué seulement si le prix vaut le travail ; sinon vends en coques.",solEau:"Risque : graines qui pourrissent si le sol reste mouillé. Action : billons drainants, arrachage dès maturité, séchage au soleil sur bâche.",decision:"Si les gousses noircissent en terre, arrache vite et sèche : ne laisse pas en sol humide."},niebe:{climat:"Chaleur + pluie à la floraison = fleurs qui tombent. Sème pour que la floraison évite les plus fortes pluies.",marche:"Vends vite après battage si tu n’as pas de sac hermétique. Sinon stocke sec, en sac fermé, et vérifie souvent.",solEau:"Risque : eau stagnante qui fait pourrir les racines. Action : billons, ne sème pas dans les creux qui gardent l’eau.",decision:"Si tu vois des pucerons en grappes sur les fleurs, enlève les parties très atteintes et demande à un expert avant tout traitement."},soja:{climat:"Pause sèche à la floraison = gousses vides. Sème dès les pluies installées, paille pour garder l’humidité.",marche:"Vends sec et trié. Ne vends pas humide : tu perds du poids et de la qualité.",solEau:"Risque : sol qui se tasse et racines qui manquent d’air. Action : sol meuble, sarclage léger, paillage.",decision:"Si les feuilles jaunissent par le bas en saison humide, vérifie le drainage avant tout : trop d’eau, ouvre une rigole."},coton:{climat:"Pluies qui s’arrêtent tôt = capsules petites. Sème tôt, suis le calendrier, ne prolonge pas un champ trop sec.",marche:"Vends au circuit habituel, propre et sec. Ne mélange pas coton propre et coton sale.",solEau:"Risque : engorgement qui fait tomber les boutons. Action : billons + drainage, ne laisse pas l’eau stagner.",decision:"Si les boutons tombent beaucoup, vérifie d’abord l’eau et les insectes sous les feuilles, puis demande à un expert."},ananas:{climat:"Forte chaleur sans eau = fruits petits. Paille épais et arrose peu mais régulier au pied en saison sèche.",marche:"Vends à maturité juste, pas trop vert ni trop mûr. Ne laisse pas les fruits mûrs au champ, ils s’abîment vite.",solEau:"Risque : eau stagnante = pourriture du cœur. Action : billons drainants, paillage, jamais d’eau qui stagne au pied.",decision:"Si le cœur pourrit, enlève le plant malade et vérifie le drainage : un pied qui baigne, c’est le prochain malade."},mangue:{climat:"Pluie à la floraison = fleurs qui tombent et fruits tachés. Taille après récolte pour aérer, laisse le vent passer.",marche:"Vends tôt en saison quand les fruits sont beaux. Ne garde pas les fruits tombés pour la vente.",solEau:"Risque : sol qui garde l’eau au pied = racines qui pourrissent. Action : demi-lune drainante, paillage, pas de cuvette qui stagne.",decision:"Si les jeunes fruits tombent beaucoup, vérifie les mouches des fruits et l’eau au pied, puis demande à un expert."},tomate:{climat:"Chaleur + pluie sur les feuilles = maladies rapides. Arrose au pied, jamais sur les feuilles, et tuteure pour aérer.",marche:"Vends vite, chaque jour de récolte. Ne stocke pas la tomate mûre : elle s’abîme et tu perds le prix.",solEau:"Risque : eau stagnante = racines qui pourrissent et fruits qui éclatent. Action : billons drainants, paillage, arrosage peu et souvent au pied.",decision:"Si les feuilles tachent par le bas, enlève les feuilles très atteintes, aère, et n’arrose plus les feuilles."},piment:{climat:"Forte chaleur + manque d’eau = fleurs qui tombent. Paille et arrose peu au pied, matin ou soir.",marche:"Vends frais vite, ou sèche proprement si tu veux attendre. Ne vends pas des piments mouillés.",solEau:"Risque : sol qui reste mouillé = flétrissement. Action : billons drainants, paillage, arrosage au pied sans noyer.",decision:"Si un pied flétrit alors que le sol est humide, arrache-le, ne l’arrose plus, et vérifie le drainage."},gombo:{climat:"Pause sèche = fruits durs et petits. Arrose peu et souvent, récolte tous les 2 à 3 jours.",marche:"Vends le jour même de la récolte. Ne garde pas le gombo d’un jour sur l’autre, il durcit.",solEau:"Risque : sol lourd qui garde l’eau = racines qui étouffent. Action : billons, paillage, sarclage léger pour aérer.",decision:"Si les fruits durcissent vite, récolte plus souvent et arrose peu au pied le soir."},oignon:{climat:"Pluie en fin de cycle = bulbes qui pourrissent au stockage. Arrête l’arrosage avant récolte, sèche bien au soleil.",marche:"Vends après un bon séchage. Ne vends pas humide : l’oignon mouillé pourrit et perd son prix.",solEau:"Risque : eau stagnante = bulbes mous. Action : billons drainants, arrêt d’arrosage, séchage sur aire propre.",decision:"Si les feuilles tombent et que le collet est mou, arrête l’eau et récolte : ne laisse pas en sol humide."},carotte:{climat:"Chaleur forte = racines courtes et amères. Sème en saison fraîche, paille léger pour garder le sol frais.",marche:"Vends vite après arrachage, racines propres. Ne laisse pas les carottes au soleil, elles ramollissent.",solEau:"Risque : sol dur ou caillouteux = racines fourchues. Action : billons meubles sans cailloux, paillage fin.",decision:"Si les feuilles jaunissent et que le sol est dur, aère doucement autour sans blesser les racines, puis paille."},patate:{climat:"Pause sèche après plantation = reprise lente. Paille dès la plantation pour garder l’humidité.",marche:"Vends vite après récolte, ou garde au frais à l’ombre. Ne laisse pas les tubercules blessés pour la vente tardive.",solEau:"Risque : eau stagnante = tubercules qui pourrissent. Action : buttes drainantes, paillage, récolte dès maturité.",decision:"Si les feuilles flétrissent alors que le sol est mouillé, ouvre le drainage et ne rajoute pas d’eau."},banane:{climat:"Vent fort + sécheresse = feuilles déchirées et régimes petits. Protège du vent, paille épais, arrose en saison sèche.",marche:"Vends le régime à maturité juste. Ne laisse pas un régime mûr sur pied, il attire les dégâts.",solEau:"Risque : pied qui baigne = racines qui pourrissent. Action : demi-lune drainante, paillage épais, compost.",decision:"Si les feuilles jaunissent par le bas et que le sol est mouillé, vérifie le drainage avant d’arroser."},papaye:{climat:"Pluie qui stagne = pied qui pourrit. Plante sur butte drainante, paille sans coller au pied.",marche:"Vends à maturité juste, fruit ferme. Ne transporte pas les fruits trop mûrs, ils s’écrasent.",solEau:"Risque : eau stagnante au pied = pourriture du collet. Action : butte drainante, paillage, arrosage au pied sans noyer.",decision:"Si le pied ramollit au collet, arrête l’eau, dégage le paillage du pied et laisse sécher."},palme:{climat:"Saison sèche longue = moins de régimes. Paille et compost au pied pour garder l’humidité.",marche:"Vends les régimes vite après récolte. Ne laisse pas les régimes au sol, l’huile se perd et la qualité baisse.",solEau:"Risque : sol sec en surface, racines qui manquent d’eau. Action : demi-lune + couverture végétale, compost.",decision:"Si les jeunes feuilles jaunissent en saison sèche, paille épais et arrose au pied le soir."},anacarde:{climat:"Pluie à la floraison = fleurs qui tombent. Taille pour aérer, laisse le vent passer.",marche:"Vends noix bien sèches et triées. Ne vends pas humide : tu perds du poids et du prix.",solEau:"Risque : eau stagnante = racines qui pourrissent. Action : demi-lune drainante, paillage, jamais de cuvette qui stagne.",decision:"Si les jeunes feuilles noircissent en saison humide, aère par taille et vérifie le drainage."},karite:{climat:"Feux + sécheresse = jeunes plants perdus. Protège du feu, paille, et arrose le jeune plant en saison sèche.",marche:"Vends noix bien sèches, propres. Garde une part pour la famille si tu transformes.",solEau:"Risque : sol qui se tasse autour du jeune plant. Action : demi-lune, paillage, sarclage léger sans blesser.",decision:"Si le jeune plant sèche en saison sèche, paille épais et arrose peu au pied le soir."},teck:{climat:"Saison sèche longue = croissance lente, mais l’arbre tient. Paille le jeune plant et protège du feu.",marche:"Le bois se vend à long terme : ne coupe pas trop tôt. Garde un plan simple : élagage, espacement, patience.",solEau:"Risque : eau qui stagne au pied du jeune plant. Action : plantation sur sol drainé, paillage, pas de cuvette.",decision:"Si le jeune plant jaunit en saison humide, vérifie le drainage : un pied qui baigne, c’est un pied en danger."},moringa:{climat:"Chaleur + manque d’eau = feuilles petites. Taille souvent, paille, arrose peu au pied.",marche:"Vends feuilles fraîches le jour même, ou sèche à l’ombre pour garder la couleur. Ne sèche pas au soleil fort.",solEau:"Risque : eau stagnante = racines qui pourrissent. Action : zaï drainant, paillage, arrosage peu et souvent.",decision:"Si les feuilles jaunissent alors que le sol est mouillé, arrête l’eau et aère le pied."},sesame:{climat:"Pluie à la récolte = graines qui noircissent. Récolte dès maturité, sèche vite.",marche:"Vends sec, propre et trié. Ne vends pas humide : le sésame mouillé perd vite sa qualité.",solEau:"Risque : sol qui reste mouillé = pourriture. Action : sol léger drainant, billons bas, séchage sur bâche.",decision:"Si les capsules s’ouvrent trop vite, récolte tôt le matin et sèche à l’ombre ventilée."},voandzou:{climat:"Sécheresse = petites gousses, mais la plante tient. Sème tôt, paille léger, laisse le sol couvert.",marche:"Vends sec et trié. Garde une part pour semence : choisis les plus belles gousses.",solEau:"Risque : eau stagnante = pourriture racinaire. Action : sol drainant, billons, ne sème pas dans les creux.",decision:"Si les feuilles jaunissent en sol mouillé, ouvre le drainage et ne rajoute pas d’eau."},fonio:{climat:"Pluies qui s’arrêtent tôt = grains petits. Sème tôt, garde le sol couvert pour garder l’humidité.",marche:"Vends propre, bien vanné. Ne vends pas avec sable : trie et vanne avant.",solEau:"Risque : sol qui se tasse et croûte. Action : sarclage léger, couverture végétale, semis peu profond.",decision:"Si la levée est faible après une croûte, casse la croûte doucement et resème les manques."},haricot:{climat:"Pluie à la floraison = fleurs qui tombent. Sème pour éviter les plus fortes pluies à la floraison.",marche:"Vends sec et trié. Ne vends pas humide : le haricot mouillé s’abîme au stockage.",solEau:"Risque : eau stagnante = racines qui pourrissent. Action : billons drainants, paillage, arrosage au pied.",decision:"Si les feuilles tachent par le bas en saison humide, aère, enlève les feuilles très atteintes, et n’arrose plus les feuilles."},chou:{climat:"Chaleur forte = pommes qui ne se forment pas bien. Arrose régulier, paille épais pour garder la fraîcheur.",marche:"Vends vite après récolte. Ne laisse pas le chou au champ après maturité, il éclate et s’abîme.",solEau:"Risque : eau stagnante = pourriture du collet. Action : billons drainants, paillage épais, arrosage au pied.",decision:"Si les feuilles du bas pourrissent, enlève-les, aère, et vérifie que l’eau ne stagne pas."},concombre:{climat:"Chaleur + pluie sur feuilles = maladies rapides. Tuteure, arrose au pied, jamais sur les feuilles.",marche:"Vends le jour même, fruits fermes. Ne laisse pas les gros fruits sur pied, ils fatiguent la plante.",solEau:"Risque : eau stagnante = racines qui pourrissent. Action : billons drainants, paillage, arrosage au pied.",decision:"Si les feuilles blanchissent par plaques, enlève les feuilles très atteintes, aère, et n’arrose plus les feuilles."},aubergine:{climat:"Chaleur + manque d’eau = fleurs qui tombent. Paille, arrose peu au pied, matin ou soir.",marche:"Vends fruits fermes et brillants. Ne laisse pas les fruits trop mûrs sur pied, ils durcissent.",solEau:"Risque : sol qui reste mouillé = racines qui étouffent. Action : billons drainants, paillage, arrosage au pied.",decision:"Si les feuilles se trouent beaucoup, regarde le dessous des feuilles et demande à un expert avant tout traitement."},gingembre:{climat:"Sécheresse = rhizomes petits. Paille épais, ombre partielle, arrose peu et souvent.",marche:"Vends frais et ferme, ou sèche proprement. Ne vends pas des rhizomes mous.",solEau:"Risque : eau stagnante = pourriture du rhizome. Action : billons drainants, paillage épais, arrosage au pied.",decision:"Si le rhizome ramollit, arrête l’eau, vérifie le drainage et récolte les parties saines."},curcuma:{climat:"Sécheresse = rhizomes petits. Paille épais, ombre partielle, arrose peu et souvent.",marche:"Vends frais et ferme, ou sèche proprement. Ne vends pas des rhizomes mous.",solEau:"Risque : eau stagnante = pourriture du rhizome. Action : billons drainants, paillage épais, arrosage au pied.",decision:"Si le rhizome ramollit, arrête l’eau, vérifie le drainage et récolte les parties saines."},bissap:{climat:"Pause sèche = calices petits. Paille, arrose peu au pied, récolte dès que les calices sont rouges.",marche:"Vends calices bien secs, rouges et propres. Ne vends pas humide : ils moisissent vite.",solEau:"Risque : eau stagnante = racines qui pourrissent. Action : billons drainants, paillage, récolte par temps sec.",decision:"Si les feuilles se trouent beaucoup, regarde le dessous des feuilles et demande à un expert."},baobab:{climat:"Sécheresse = croissance lente, mais l’arbre tient. Protège le jeune plant, paille, arrose en saison sèche.",marche:"Vends feuilles sèches propres et fruits bien secs. Garde une part pour la famille.",solEau:"Risque : eau stagnante au pied du jeune plant. Action : demi-lune drainante, paillage, pas de cuvette.",decision:"Si le jeune plant sèche en saison sèche, paille épais et arrose peu au pied le soir."},citron:{climat:"Pluie à la floraison = fleurs qui tombent. Taille légère pour aérer, laisse le vent passer.",marche:"Vends fruits fermes et propres. Ne laisse pas les fruits tombés pour la vente.",solEau:"Risque : eau stagnante = racines qui pourrissent. Action : demi-lune drainante, paillage, arrosage au pied.",decision:"Si les feuilles jaunissent par plaques, vérifie l’eau et le drainage avant tout, puis demande à un expert."}};for(let e in ce){let n=mf[e];if(n)ce[e]={...ce[e],conseil:ce[e].conseil+" — Discussion adjacente — ce qu’il faut aussi savoir : Climat : "+n.climat+" Marché : "+n.marche+" Sol + eau : "+n.solEau+" Décision : "+n.decision+" Indicatif — varie selon sol, saison et pratiques."}}var Ey={irrigation:`<div class="info-card"><h3>\uD83D\uDCA7 Bien arroser selon le stade de la culture</h3><p>Les besoins en eau changent tout au long du cycle : légers à la germination, croissants pendant la croissance des feuilles, maximums à la floraison et au grossissement des fruits, puis réduits juste avant la récolte pour concentrer le goût et éviter que les fruits n'éclatent.</p></div><div class="info-card"><h3>⏰ Le bon moment</h3><p>Arrose tôt le matin ou en fin de journée — jamais en plein soleil de midi, où la majorité de l'eau s'évapore avant d'atteindre les racines. Vise le pied de la plante, pas les feuilles, pour limiter les maladies fongiques.</p></div><div class="info-card"><h3>\uD83E\uDEA3 Reconnaître le manque ou l'excès</h3><ul><li>Manque d'eau : feuilles flétries en pleine journée, croissance ralentie, petits fruits.</li><li>Excès d'eau : feuilles jaunes, racines qui pourrissent, maladies fongiques plus fréquentes.</li></ul></div><div class="info-card"><h3>\uD83D\uDEB0 Goutte-à-goutte</h3><p>Quand c'est possible, l'irrigation goutte-à-goutte économise beaucoup d'eau par rapport à l'arrosage à la volée, réduit les maladies (feuillage sec) et limite la pousse des mauvaises herbes entre les lignes.</p></div>`,aeration:`<div class="info-card"><h3>\uD83C\uDF2C️ Pourquoi aérer le sol</h3><p>Un sol tassé empêche les racines de respirer et de bien s'installer. Le labour, le sarclage et le billonnage cassent la croûte de surface et permettent à l'eau et à l'air de mieux pénétrer.</p></div><div class="info-card"><h3>\uD83D\uDE9C Techniques courantes</h3><ul><li>Labour avant la saison des pluies pour ameublir la terre en profondeur.</li><li>Billonnage : indispensable sur sol argileux ou en pleine saison des pluies, pour évacuer l'excès d'eau et éviter l'asphyxie des racines.</li><li>Sarclage léger et régulier pendant la croissance, sans blesser les racines superficielles (attention avec l'ananas, le maïs, la pastèque).</li></ul></div><div class="info-card"><h3>⚠️ Ne pas travailler un sol trop humide</h3><p>Travailler la terre juste après une forte pluie la compacte davantage au lieu de l'aérer. Attends qu'elle sèche un peu.</p></div>`,protection:`<div class="info-card"><h3>\uD83D\uDEE1️ Protection naturelle contre les ravageurs</h3><p>Les associations de cultures peuvent réduire la pression des insectes : basilic près des tomates et poivrons, ail autour des cultures sensibles, œillets d'Inde en bordure de parcelle. Rien ne remplace une inspection régulière du dessous des feuilles.</p></div><div class="info-card"><h3>\uD83D\uDD04 Rotation des cultures</h3><p>Ne pas replanter la même famille (tomate, piment, pomme de terre ; ou pastèque, concombre, courge) sur la même parcelle plusieurs saisons de suite. Ça casse le cycle des maladies et ravageurs installés dans le sol.</p></div><div class="info-card"><h3>\uD83D\uDC64 Protection humaine</h3><p>Une clôture (même végétale, comme une haie de campêche) et une surveillance régulière du champ restent la meilleure protection contre le vol de récolte et les animaux errants.</p></div><div class="info-card"><h3>\uD83C\uDF3F Rappel</h3><p>Pour les traitements naturels précis (neem, savon noir, piment...), consulte les savoirs paysans affichés après un diagnostic sur l'écran Accueil.</p></div>`,eau:`<div class="info-card"><h3>\uD83D\uDEB0 Gérer l'eau à l'échelle du champ</h3><ul><li>Rigoles de drainage sur terrain en pente pour évacuer l'excès de pluie.</li><li>Billons surélevés en zone humide ou sol argileux.</li><li>Paillage (paille, résidus de récolte) pour garder l'humidité du sol et réduire les arrosages.</li></ul></div><div class="info-card"><h3>\uD83C\uDF27️ Captage de pluie</h3><p>Un simple bassin ou une réserve d'eau de pluie peut faire la différence pendant les semaines sèches, surtout pour les cultures maraîchères à cycle court.</p></div><div class="info-card"><h3>\uD83D\uDCC5 Adapter au calendrier pluvieux</h3><p>Choisir des cultures dont le cycle correspond à la saison des pluies de ta zone réduit fortement le besoin d'irrigation d'appoint.</p></div>`},zy=[{n:"Houe / daba",d:"Travail du sol, sarclage, billonnage."},{n:"Machette / coupe-coupe",d:"Défrichage, récolte, entretien."},{n:"Arrosoir",d:"Arrosage manuel sur petites surfaces."},{n:"Pulvérisateur à dos",d:"Application de traitements naturels ou phytosanitaires."},{n:"Brouette",d:"Transport de compost, récolte, matériaux."},{n:"Sécateur",d:"Taille, greffage, récolte de fruits."},{n:"Bâche de séchage",d:"Séchage du grain, protection de la récolte."},{n:"Sacs de stockage hermétiques (type PICS)",d:"Protège le grain stocké des insectes sans produit chimique."},{n:"Kit de test pH",d:"Vérifier rapidement l'acidité du sol avant de semer."}],fu=["Cotonou","Porto-Novo","Parakou","Bohicon","Abomey","Abomey-Calavi","Malanville","Natitingou","Ouidah","Djougou","Kandi","Lokossa","Pobe","Sakete","Dassa","Save","Bembereke","Banikoara","Karimama","Tanguieta","Come","Allada","Aplahoue","Ke
